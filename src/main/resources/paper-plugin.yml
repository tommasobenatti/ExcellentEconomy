main: su.nightexpress.excellenteconomy.EconomyPlugin
version: '${version}'
name: ExcellentEconomy
author: NightExpress
description: A modern, lightweight economy plugin that lets you create unlimited custom currencies.
folia-supported: true
load: STARTUP
api-version: 1.21
dependencies:
  server:
    nightcore:
      load: BEFORE
      required: true
    Vault:
      load: BEFORE
      required: false
      join-classpath: true
    VaultUnlocked:
      load: BEFORE
      required: false
      join-classpath: true
    PlaceholderAPI:
      required: false
    PlayerPoints:
      required: false
    DeluxeCoinflip:
      required: false
